name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build e Testes - Demo (Monólito)
      run: |
        cd demo
        chmod +x mvnw
        ./mvnw clean test

    - name: Build e Testes - Review Service
      run: |
        cd review-service
        chmod +x ../demo/mvnw
        ../demo/mvnw clean test
