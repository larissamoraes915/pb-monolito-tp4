name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build e Testes - Demo (Monólito)
      run: |
        cd demo
        chmod +x mvnw
        ./mvnw clean test

    - name: Build e Testes - Review Service
      run: |
        cd review-service
        chmod +x ../demo/mvnw
        ../demo/mvnw clean test
